[project]
name = "ftm"
version = "0.1.0"
description = "Tracks gifts, hospitality, and financial interests disclosed by Australian politicians."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "flask>=3.1.3",
    "pdfminer-six>=20260107",
    "python-slugify>=8.0.4",
    "requests>=2.33.1",
]

[project.scripts]
ftm = "ftm.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "responses>=0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
